spring.application.name=MJCinema
# Datasource (set DB_HOST as the bare hostname, plus DB_USER and DB_PASSWORD; DB_PORT and DB_NAME are optional)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:10955}/${DB_NAME:mjcinema}?useSSL=true&trustServerCertificate=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#TMDB Access
tmdb.api.key=${TMDB_API_KEY}
tmdb.base.url=${TMDB_BASE_URL}

#PORT
server.port=${PORT:8080}
server.address=0.0.0.0
